<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centralized Work Schedule (NZ)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .suggestions-box::-webkit-scrollbar {
      width: 6px;
    }
    .suggestions-box::-webkit-scrollbar-thumb {
      background-color: #1e40af;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 p-4 md:p-6 min-h-screen">
  <div class="max-w-6xl mx-auto bg-blue-950 border border-blue-800/80 p-5 md:p-6 rounded-2xl shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-blue-800/70 pb-4 gap-3">
      <div>
        <p class="text-xs font-bold text-sky-400 tracking-wider uppercase">New Zealand Team Operations</p>
        <h1 class="text-2xl font-bold text-white-900 ">JP Interiors Limited Work Schedule</h1>
        <p class="text-xs text-gray-200/80 mt-0.5">Live synced across all devices — Grouped by date & click any address to open in Google Maps</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="text-xs bg-amber-950 text-amber-300 border border-amber-700/60 font-semibold px-3 py-1.5 rounded-full">Connecting...</span>
      </div>
    </div>

    <!-- Add / Edit Schedule Form -->
    <div class="bg-blue-900/45 border border-blue-700/60 p-4 rounded-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 id="formTitle" class="font-bold text-white text-base">➕ Add New Schedule</h2>
        <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs bg-blue-800 hover:bg-blue-700 text-blue-100 border border-blue-600 font-semibold px-2.5 py-1 rounded transition">
          Cancel Edit
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Name -->
        <div>
          <label class="block text-xs font-semibold text-blue-200 mb-1">Name *</label>
          <input type="text" id="workerName" placeholder="e.g. Franklin Nesperos" class="w-full border border-blue-700/80 p-2 rounded-lg bg-slate-900/90 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none">
        </div>

        <!-- Date -->
        <div>
          <label class="block text-xs font-semibold text-blue-200 mb-1">Date *</label>
          <input type="date" id="workDate" class="w-full border border-blue-700/80 p-2 rounded-lg bg-slate-900/90 text-white text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none [color-scheme:dark]">
        </div>

        <!-- Location with NZ Autocomplete -->
        <div class="relative">
          <label class="block text-xs font-semibold text-blue-200 mb-1">Location (NZ Address Search) *</label>
          <div class="relative">
            <input type="text" id="workLocation" autocomplete="off" placeholder="Type an address in New Zealand..." class="w-full border border-blue-700/80 p-2 pr-8 rounded-lg bg-slate-900/90 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none">
            <span id="locationSpinner" class="hidden absolute right-2.5 top-2.5 text-xs text-sky-400 animate-pulse">⏳</span>
          </div>
          <!-- Autocomplete Suggestions Dropdown -->
          <ul id="addressSuggestions" class="suggestions-box hidden absolute z-50 w-full bg-slate-900 border border-blue-700 rounded-lg shadow-xl mt-1 max-h-56 overflow-y-auto divide-y divide-blue-900/80 text-xs"></ul>
        </div>

        <!-- Remarks -->
        <div>
          <label class="block text-xs font-semibold text-blue-200 mb-1">Remarks</label>
          <input type="text" id="workRemarks" placeholder="e.g. Gib Stopping / Skimming / Urgent" class="w-full border border-blue-700/80 p-2 rounded-lg bg-slate-900/90 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none">
        </div>

        <!-- Comments -->
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-blue-200 mb-1">Comments</label>
          <input type="text" id="workComments" placeholder="e.g. Key lockbox code 1234, bring scaffold..." class="w-full border border-blue-700/80 p-2 rounded-lg bg-slate-900/90 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none">
        </div>
      </div>

      <button id="saveScheduleBtn" onclick="saveSchedule()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-semibold transition shadow-md">
        Save & Publish to Live Schedule
      </button>
    </div>

    <!-- Filter & Search Bar -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-2">
      <h2 class="text-lg font-bold text-white">📋 Live Schedule Board</h2>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <input type="text" id="searchFilter" onkeyup="renderTable()" placeholder="Search name, date, location, remarks..." class="w-full sm:w-72 border border-blue-700/80 px-3 py-1.5 rounded-lg text-sm bg-slate-900/90 text-white placeholder-slate-400 focus:ring-2 focus:ring-sky-400 outline-none">
      </div>
    </div>

    <!-- Grouped Schedule Container (Separated by Date with Spacing) -->
    <div id="scheduleGroupsContainer" class="space-y-6">
      <div class="p-6 text-center text-blue-300/60 italic bg-slate-900/60 rounded-xl border border-blue-800/60">
        Loading live schedule...
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="max-w-6xl mx-auto mt-3 text-left">
    <p class="text-xs font-semibold text-blue-300/80">DEVELOPER : Franklin Nesperos</p>
  </div>

  <!-- Firebase & NZ Address Search Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8kZ7TJ8_8h2kZ02MeXU4LHTofzMzy23g",
      authDomain: "maynilad-calculator.firebaseapp.com",
      projectId: "maynilad-calculator",
      storageBucket: "maynilad-calculator.firebasestorage.app",
      messagingSenderId: "236444081363",
      appId: "1:236444081363:web:9293f7d7817484be7cc826"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const scheduleDocRef = doc(db, "work_schedule", "master_board");

    let schedules = [];
    let editingId = null;

    document.getElementById('workDate').valueAsDate = new Date();

    onSnapshot(scheduleDocRef, (docSnap) => {
      const syncStatus = document.getElementById('syncStatus');
      if (docSnap.exists()) {
        schedules = docSnap.data().items || [];
      } else {
        schedules = [];
        syncToFirebase(schedules);
      }
      renderTable();
      syncStatus.innerText = "🟢 Live Synced";
      syncStatus.className = "text-xs bg-emerald-950 text-emerald-300 border border-emerald-700/60 font-semibold px-3 py-1.5 rounded-full";
    }, (error) => {
      console.error("Firebase Sync Error:", error);
      const syncStatus = document.getElementById('syncStatus');
      syncStatus.innerText = "🔴 Sync Error";
      syncStatus.className = "text-xs bg-rose-950 text-rose-300 border border-rose-700/60 font-semibold px-3 py-1.5 rounded-full";
    });

    async function syncToFirebase(itemsList) {
      try {
        await setDoc(scheduleDocRef, { items: itemsList });
      } catch (e) {
        alert("Error saving data to database. Please try again.");
      }
    }

    // ==========================================
    // NEW ZEALAND ADDRESS AUTOCOMPLETE SEARCH
    // ==========================================
    const locationInput = document.getElementById('workLocation');
    const suggestionsBox = document.getElementById('addressSuggestions');
    const locationSpinner = document.getElementById('locationSpinner');
    let searchTimeout = null;

    locationInput.addEventListener('input', function() {
      const query = this.value.trim();
      clearTimeout(searchTimeout);

      if (query.length < 3) {
        suggestionsBox.classList.add('hidden');
        suggestionsBox.innerHTML = '';
        return;
      }

      searchTimeout = setTimeout(() => {
        fetchNZAddresses(query);
      }, 400);
    });

    async function fetchNZAddresses(query) {
      locationSpinner.classList.remove('hidden');
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=nz&addressdetails=1&limit=6&q=${encodeURIComponent(query)}`;
        const response = await fetch(url, {
          headers: { 'Accept-Language': 'en' }
        });
        const results = await response.json();

        suggestionsBox.innerHTML = '';
        if (results.length > 0) {
          results.forEach(place => {
            const cleanAddress = place.display_name.replace(/, New Zealand$/i, '');
            const li = document.createElement('li');
            li.className = "p-2.5 hover:bg-blue-900/70 cursor-pointer flex items-start gap-2 transition";
            li.innerHTML = `<span class="text-rose-400 mt-0.5">📍</span><span class="text-slate-100 leading-snug">${cleanAddress}</span>`;
            li.onclick = () => {
              locationInput.value = cleanAddress;
              suggestionsBox.classList.add('hidden');
            };
            suggestionsBox.appendChild(li);
          });
          suggestionsBox.classList.remove('hidden');
        } else {
          suggestionsBox.innerHTML = `<li class="p-2.5 text-slate-400 italic">No exact match found in NZ — you can still type the address manually.</li>`;
          suggestionsBox.classList.remove('hidden');
        }
      } catch (err) {
        console.error("Address search error:", err);
      } finally {
        locationSpinner.classList.add('hidden');
      }
    }

    document.addEventListener('click', (e) => {
      if (!locationInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.classList.add('hidden');
      }
    });

    // ==========================================
    // SAVE, EDIT & DELETE FUNCTIONS
    // ==========================================
    window.saveSchedule = async function() {
      const name = document.getElementById('workerName').value.trim();
      const date = document.getElementById('workDate').value;
      const location = document.getElementById('workLocation').value.trim();
      const remarks = document.getElementById('workRemarks').value.trim();
      const comments = document.getElementById('workComments').value.trim();

      if (!name || !date || !location) {
        return alert("Please enter Name, Date, and Location.");
      }

      if (editingId) {
        const index = schedules.findIndex(item => item.id === editingId);
        if (index !== -1) {
          schedules[index] = { id: editingId, name, date, location, remarks, comments };
        }
      } else {
        schedules.push({
          id: Date.now().toString(),
          name,
          date,
          location,
          remarks,
          comments
        });
      }

      schedules.sort((a, b) => new Date(b.date) - new Date(a.date));

      await syncToFirebase(schedules);
      resetForm();
    };

    window.editSchedule = function(id) {
      const item = schedules.find(s => s.id === id);
      if (!item) return;

      editingId = id;
      document.getElementById('workerName').value = item.name;
      document.getElementById('workDate').value = item.date;
      document.getElementById('workLocation').value = item.location;
      document.getElementById('workRemarks').value = item.remarks || '';
      document.getElementById('workComments').value = item.comments || '';

      document.getElementById('formTitle').innerText = "✏️ Edit Schedule";
      document.getElementById('saveScheduleBtn').innerText = "💾 Update Schedule";
      document.getElementById('saveScheduleBtn').className = "w-full bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-lg font-semibold transition shadow-md";
      document.getElementById('cancelEditBtn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteSchedule = async function(id) {
      if (!confirm("Are you sure you want to delete this schedule?")) return;
      schedules = schedules.filter(item => item.id !== id);
      await syncToFirebase(schedules);
    };

    window.resetForm = function() {
      editingId = null;
      document.getElementById('workerName').value = '';
      document.getElementById('workDate').valueAsDate = new Date();
      document.getElementById('workLocation').value = '';
      document.getElementById('workRemarks').value = '';
      document.getElementById('workComments').value = '';

      document.getElementById('formTitle').innerText = "➕ Add New Schedule";
      document.getElementById('saveScheduleBtn').innerText = "Save & Publish to Live Schedule";
      document.getElementById('saveScheduleBtn').className = "w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-semibold transition shadow-md";
      document.getElementById('cancelEditBtn').classList.add('hidden');
    };

    // ==========================================
    // RENDER SEPARATED DATE CARDS WITH SPACING
    // ==========================================
    window.renderTable = function() {
      const container = document.getElementById('scheduleGroupsContainer');
      const filterText = document.getElementById('searchFilter').value.toLowerCase().trim();
      container.innerHTML = '';

      const filtered = schedules.filter(item => {
        return (
          item.name.toLowerCase().includes(filterText) ||
          item.date.toLowerCase().includes(filterText) ||
          item.location.toLowerCase().includes(filterText) ||
          (item.remarks && item.remarks.toLowerCase().includes(filterText)) ||
          (item.comments && item.comments.toLowerCase().includes(filterText))
        );
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-blue-300/60 italic bg-slate-900/60 rounded-xl border border-blue-800/60">
            No schedules found.
          </div>
        `;
        return;
      }

      // Group entries automatically by Date
      const groupedByDate = {};
      filtered.forEach(item => {
        if (!groupedByDate[item.date]) {
          groupedByDate[item.date] = [];
        }
        groupedByDate[item.date].push(item);
      });

      // Sort dates (Newest / Upcoming first)
      const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a));

      sortedDates.forEach(dateKey => {
        const itemsForDate = groupedByDate[dateKey];
        const formattedDate = new Date(dateKey + 'T00:00:00').toLocaleDateString('en-NZ', {
          weekday: 'long',
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        let rowsHtml = '';
        itemsForDate.forEach(item => {
          const mapQuery = encodeURIComponent(`${item.location}, New Zealand`);
          const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

          rowsHtml += `
            <tr class="hover:bg-blue-900/40 transition">
              <td class="p-3.5 font-bold text-white whitespace-nowrap w-48">${escapeHtml(item.name)}</td>
              <td class="p-3.5">
                <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" title="Open in Google Maps" class="inline-flex items-start gap-1.5 text-sky-400 hover:text-sky-300 hover:underline font-medium">
                  <span class="mt-0.5">📍</span>
                  <span>${escapeHtml(item.location)}</span>
                </a>
              </td>
              <td class="p-3.5 whitespace-nowrap">
                ${item.remarks 
                  ? `<span class="inline-block bg-sky-950 text-sky-300 border border-sky-700/60 text-xs font-semibold px-2.5 py-0.5 rounded-full">${escapeHtml(item.remarks)}</span>` 
                  : '<span class="text-slate-500 text-xs">-</span>'}
              </td>
              <td class="p-3.5 text-slate-300 text-xs max-w-xs">${escapeHtml(item.comments || '-')}</td>
              <td class="p-3.5 text-center whitespace-nowrap w-32">
                <button onclick="editSchedule('${item.id}')" class="text-amber-400 hover:text-amber-300 font-semibold text-xs px-2 py-1 rounded hover:bg-amber-950/60 transition">✏️ Edit</button>
                <button onclick="deleteSchedule('${item.id}')" class="text-rose-400 hover:text-rose-300 font-semibold text-xs px-2 py-1 rounded hover:bg-rose-950/60 transition">🗑️ Delete</button>
              </td>
            </tr>
          `;
        });

        // Separate Card Block per Date
        const dateCard = document.createElement('div');
        dateCard.className = "rounded-xl border border-blue-700/80 bg-slate-900/80 shadow-lg overflow-hidden";
        dateCard.innerHTML = `
          <!-- Date Section Header -->
          <div class="bg-blue-900/90 px-4 py-2.5 border-b border-blue-700/80 flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="text-base">📅</span>
              <span class="font-bold text-white text-sm tracking-wide">${formattedDate}</span>
            </div>
            <span class="text-xs font-semibold bg-blue-950 text-sky-300 border border-blue-700 px-2.5 py-0.5 rounded-full">
              ${itemsForDate.length} ${itemsForDate.length === 1 ? 'Entry' : 'Entries'}
            </span>
          </div>

          <!-- Entries Table for this Date -->
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-blue-950/70 text-sky-200/80 text-[11px] uppercase tracking-wider border-b border-blue-900/80">
                  <th class="px-3.5 py-2">Name</th>
                  <th class="px-3.5 py-2">Location (Click for Map)</th>
                  <th class="px-3.5 py-2">Remarks</th>
                  <th class="px-3.5 py-2">Comments</th>
                  <th class="px-3.5 py-2 text-center">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-blue-900/60 text-sm">
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        `;

        container.appendChild(dateCard);
      });
    };

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
